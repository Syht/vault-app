openapi: 3.0.3
info:
  title: VaultApp Media API
  description: REST API for managing different types of media (manga, series, films, comics, books, anime)
  version: 1.0.0
servers:
  - url: http://localhost:8080/api

paths:
  /manga:
    get:
      summary: Get all mangas
      description: Retrieve a list of all mangas in the database, with optional pagination.
      operationId: getAllManga
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: Page size for pagination
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of mangas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MangaDTO'
        '500':
          description: Internal server error
    post:
      summary: Create a new manga
      description: Adds a new manga to the database.
      operationId: createManga
      requestBody:
        description: Manga object to be created
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MangaDTO'
      responses:
        '201':
          description: Manga created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MangaDTO'
        '400':
          description: Invalid manga data
        '500':
          description: Internal server error

  /manga/{id}:
    get:
      summary: Get a specific manga by ID
      description: Retrieve a specific manga by its unique identifier.
      operationId: getMangaById
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the manga to retrieve
          schema:
            type: integer
      responses:
        '200':
          description: The manga object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MangaDTO'
        '404':
          description: Manga not found
        '500':
          description: Internal server error
    put:
      summary: Update a manga
      description: Update the details of an existing manga.
      operationId: updateManga
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the manga to update
          schema:
            type: integer
      requestBody:
        description: Updated manga object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MangaDTO'
      responses:
        '200':
          description: Manga updated successfully
        '400':
          description: Invalid manga data
        '404':
          description: Manga not found
        '500':
          description: Internal server error
    delete:
      summary: Delete a manga
      description: Deletes a manga by its unique identifier.
      operationId: deleteManga
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the manga to delete
          schema:
            type: integer
      responses:
        '204':
          description: Manga deleted successfully
        '404':
          description: Manga not found
        '500':
          description: Internal server error

